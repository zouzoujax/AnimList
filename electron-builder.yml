appId: dev.willi.animelist
productName: AnimeList
copyright: © ${author}

directories:
  buildResources: build
  output: release

files:
  - out/**
  - '!**/*.map'
  - '!**/*.ts'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  # Le dossier se choisit sur notre propre page (build/installer.nsh), pas sur
  # la page grise de MUI : on désactive donc celle d'electron-builder.
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AnimeList
  deleteAppDataOnUninstall: false

# Where the app looks for updates, and where `npm run release` uploads them.
# electron-updater needs the `latest.yml` that electron-builder generates next to
# the installer, so publishing by hand-uploading only the .exe will not work.
publish:
  provider: github
  owner: zouzoujax
  repo: AnimList
  releaseType: release
